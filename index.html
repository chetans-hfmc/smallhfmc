<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HFMC Case Tracker — the shared UAE mortgage pipeline: cases, bank submissions, commissions, tasks, directives and the MPBF calculator." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b171d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HFMC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>HFMC · UAE Mortgage Case Tracker</title>
    <script>
      (function () {
        var t = "light";
        try {
          t = localStorage.getItem("hfmc.theme") === "dark" ? "dark" : "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- shown until React mounts; replaced automatically -->
      <div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b171d;color:#e8f1ef;font-family:'Space Grotesk',system-ui,sans-serif;flex-direction:column;gap:14px">
        <svg width="40" height="40" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#F2B04C" fill-opacity="0.12" stroke="#F2B04C" stroke-opacity="0.4"/><path d="M7 16h4l3-7 4 14 3-7h4" stroke="#F2B04C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-weight:700;letter-spacing:0.06em;font-size:17px">HFMC <span style="color:#f2b04c">·</span> CASE TRACKER</div>
        <div style="color:#617e7c;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;animation:bootpulse 1.4s ease infinite">opening the pipeline…</div>
        <style>@keyframes bootpulse{0%,100%{opacity:1}50%{opacity:0.35}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
